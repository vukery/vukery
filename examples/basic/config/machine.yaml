# examples/basic: the smallest complete vukery game. No display, no sound.
#
# A trough with three balls, a start button, two flippers, two slingshots
# and one target. Section and setting names are MPF's.

switches:
  s_start:
    number: "0"
    tags: start
  s_trough1:
    number: "1"
  s_trough2:
    number: "2"
  s_trough3:
    number: "3"
  s_left_flipper:
    number: "4"
  s_right_flipper:
    number: "5"
  s_left_sling:
    number: "6"
  s_right_sling:
    number: "7"
  s_target:
    number: "8"

coils:
  c_trough_eject:
    number: "0"
    default_pulse_ms: 20
  c_left_flipper:
    number: "1"
    default_pulse_ms: 30
    default_hold_power: 0.125
  c_right_flipper:
    number: "2"
    default_pulse_ms: 30
    default_hold_power: 0.125
  c_left_sling:
    number: "3"
  c_right_sling:
    number: "4"

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3
    eject_coil: c_trough_eject
    tags: trough, home, drain

flippers:
  left_flipper:
    main_coil: c_left_flipper
    activation_switch: s_left_flipper
  right_flipper:
    main_coil: c_right_flipper
    activation_switch: s_right_flipper

autofire_coils:
  left_sling:
    coil: c_left_sling
    switch: s_left_sling
  right_sling:
    coil: c_right_sling
    switch: s_right_sling

game:
  balls_per_game: 3

modes:
  - base
