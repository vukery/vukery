# examples/dual_display: examples/basic plus two displays: a main screen and a
# small apron screen. Each display gets its own media controller window.
#
# YAML describes the *machine*: what's wired where. Game logic (scoring,
# what happens when) lives in Python, in modes/. Section and setting names
# are MPF's, so an MPF machine config mostly carries over as is.

switches:
  s_start:
    number: "0"        # the hardware number; on the simulated platforms any unique string works
    tags: start        # the start button: vukery's attract and game modes listen for this tag
  s_trough1:
    number: "1"
  s_trough2:
    number: "2"
  s_trough3:
    number: "3"
  s_left_flipper:
    number: "4"
  s_right_flipper:
    number: "5"
  s_left_sling:
    number: "6"
  s_right_sling:
    number: "7"
  s_target:
    number: "8"

coils:
  c_trough_eject:
    number: "0"
    default_pulse_ms: 20      # how long the coil fires (vukery enforces its limits)
  c_left_flipper:
    number: "1"
    default_pulse_ms: 30
    default_hold_power: 0.125 # flippers hold at low power while the button is held
  c_right_flipper:
    number: "2"
    default_pulse_ms: 30
    default_hold_power: 0.125
  c_left_sling:
    number: "3"
  c_right_sling:
    number: "4"

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3  # one switch per ball: 3 balls in the machine
    eject_coil: c_trough_eject                      # fired to serve a ball
    tags: trough, home, drain   # trough: where balls drain to; home: a game can only start when it's full

flippers:                       # hardware rules: the controller fires these itself, instantly
  left_flipper:
    main_coil: c_left_flipper
    activation_switch: s_left_flipper   # on at ball_started, off at ball_will_end (MPF's defaults)
  right_flipper:
    main_coil: c_right_flipper
    activation_switch: s_right_flipper

autofire_coils:                 # slingshots and pop bumpers: the switch fires the coil
  left_sling:
    coil: c_left_sling
    switch: s_left_sling
  right_sling:
    coil: c_right_sling
    switch: s_right_sling

game:
  balls_per_game: 3

dashboard:                      # vuk me only: where things sit on its virtual playfield
  playfield:                    # [x, y] from the bottom-left corner, 0 to 1; anything left out is placed for you
    s_target: [0.5, 0.62]

modes:                          # the game's own modes, from modes/<name>/<name>.py
  - start_screen                # between games: a title on main, "PRESS START" on the apron
  - base                        # scoring; the score on main, player and ball on the apron

displays:                       # having this section is what loads media controllers
  main:                         # the first display is the default for show_slide()
    width: 800
    height: 480
  apron:                        # a second window, with its own media controller process
    width: 480
    height: 272
