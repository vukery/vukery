# examples/display: examples/basic plus one display showing the score.
#
# YAML describes the *machine*: what's wired where. Game logic (scoring,
# what happens when) lives in Python, in modes/. Section and setting names
# are MPF's, so an MPF machine config mostly carries over as is.

switches:
  s_start:
    number: 0        # the hardware number; on the simulated platforms any unique one works
    tags: start        # the start button: vukery's attract and game modes listen for this tag
  s_trough1:
    number: 1
  s_trough2:
    number: 2
  s_trough3:
    number: 3
  s_left_flipper:
    number: 4
  s_right_flipper:
    number: 5
  s_left_sling:
    number: 6
  s_right_sling:
    number: 7
  s_target:
    number: 8

coils:
  c_trough_eject:
    number: 0
    default_pulse_ms: 20      # how long the coil fires (vukery enforces its limits)
  c_left_flipper:
    number: 1
    default_pulse_ms: 30
    default_hold_power: 0.125 # flippers hold at low power while the button is held
  c_right_flipper:
    number: 2
    default_pulse_ms: 30
    default_hold_power: 0.125
  c_left_sling:
    number: 3
  c_right_sling:
    number: 4

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3  # one switch per ball: 3 balls in the machine
    eject_coil: c_trough_eject                      # fired to serve a ball
    tags: trough, home, drain   # trough: where balls drain to; home: a game can only start when it's full

flippers:                       # hardware rules: the controller fires these itself, instantly
  left_flipper:
    main_coil: c_left_flipper
    activation_switch: s_left_flipper   # on at ball_started, off at ball_will_end (MPF's defaults)
  right_flipper:
    main_coil: c_right_flipper
    activation_switch: s_right_flipper

autofire_coils:                 # slingshots and pop bumpers: the switch fires the coil
  left_sling:
    coil: c_left_sling
    switch: s_left_sling
  right_sling:
    coil: c_right_sling
    switch: s_right_sling

game:
  balls_per_game: 3

modes:                          # the game's own modes, from modes/<name>/mode.py
  - start_screen                # "PRESS START" between games
  - base                        # scoring and the score display

displays:                       # having this section is what loads a media controller
  main:                         # one media controller window per display
    width: 800
    height: 480
