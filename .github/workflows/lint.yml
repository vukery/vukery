# Lints with ruff: vukery, the specs, the examples and the scripts. MPF's
# copied files are listed in pyproject.toml and left out.
name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (uv installs Python 3.15 too)
        run: uv sync
      - name: ruff
        run: uv run ruff check vukery tests examples scripts
