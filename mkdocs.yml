site_name: vukery
site_description: A very opinionated pinball framework based on the Mission Pinball Framework, built to be simple, lean and LLM-friendly
site_url: https://vukery.com/
repo_url: https://github.com/vukery/vukery
repo_name: vukery/vukery

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes   # a section's first page is its overview (Modes, Built-in modes…)

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Writing a game: getting-started/writing-a-game.md
      - Examples: getting-started/examples.md
      - Testing a game: getting-started/testing.md
  - Modes:
      - modes/index.md
      - Built-in modes:
          - modes/built-in/index.md
          - High score: modes/built-in/high-score.md
          - Tilt: modes/built-in/tilt.md
  - Shows, displays and sound:
      - Shows: media/shows.md
      - Displays and scenes: media/scenes.md
      - Sound: media/sound.md
  - Machine:
      - Devices:
          - Coils: devices/coils.md
          - Lights: devices/lights.md
          - Flippers: devices/flippers.md
          - Ball saves: devices/ball-saves.md
          - Ball search: devices/ball-search.md
      - Hardware:
          - FAST: hardware/fast.md
  - Tools:
      - The vuk command: tools/cli.md
      - The dashboard (vuk me): tools/dashboard.md
      - Logging: tools/logging.md
  - Project:
      - Status (0.0.x): status.md
      - Changelog: changelog.md
      - Contributing: contributing.md

extra_css:
  - stylesheets/mkdocs.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - attr_list
  - admonition
  - tables
