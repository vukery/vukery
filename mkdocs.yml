site_name: vukery
site_description: A very opinionated pinball framework based on the Mission Pinball Framework, built to be simple, lean and LLM-friendly
site_url: https://vukery.com/
repo_url: https://github.com/vukery/vukery
repo_name: vukery/vukery

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes   # a section's first page is its overview (Modes, Built-in modes…)
    - navigation.sections  # top-level sections are always-open groups in the menu
    - navigation.expand    # and their subsections start open, so the menu looks the same on every page
    - navigation.path      # breadcrumbs above each page's title
    - navigation.instant   # pages load in place: the menu and its scroll position stay put
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Writing a game: getting-started/writing-a-game.md
      - Examples: getting-started/examples.md
      - Testing a game: getting-started/testing.md
  - Modes:
      - modes/index.md
      - Built-in modes:
          - modes/built-in/index.md
          - High score: modes/built-in/high-score.md
          - Tilt: modes/built-in/tilt.md
  - Shows, displays and sound:
      - Shows: media/shows.md
      - Displays and scenes: media/scenes.md
      - Sound: media/sound.md
  - Machine:
      - Configuration reference: machine/config-reference.md
      - Devices:
          - Coils: devices/coils.md
          - Lights: devices/lights.md
          - Flippers: devices/flippers.md
          - Ball saves: devices/ball-saves.md
          - Ball search: devices/ball-search.md
      - Hardware:
          - FAST: hardware/fast.md
  - Tools:
      - The vuk command: tools/cli.md
      - The dashboard (vuk me): tools/dashboard.md
      - Logging: tools/logging.md
  - Project:
      - Status (0.0.x): status.md
      - Changelog: changelog.md
      - Contributing: contributing.md

plugins:
  - search
  # The pages that moved when the docs were reorganized (0.0.29): old links still land
  - redirects:
      redirect_maps:
        getting-started.md: getting-started/index.md
        writing-a-game.md: getting-started/writing-a-game.md
        examples.md: getting-started/examples.md
        testing.md: getting-started/testing.md
        modes.md: modes/index.md
        high-score.md: modes/built-in/high-score.md
        tilt.md: modes/built-in/tilt.md
        shows.md: media/shows.md
        scenes.md: media/scenes.md
        displays.md: media/scenes.md
        sound.md: media/sound.md
        cli.md: tools/cli.md
        dashboard.md: tools/dashboard.md
        logging.md: tools/logging.md

extra:
  analytics:                 # Material's own Google Analytics (GA4) support
    provider: google
    property: G-LXW1LS8B2F

extra_css:
  - stylesheets/mkdocs.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - attr_list
  - admonition
  - tables
