site_name: vukery
site_description: A very opinionated pinball framework based on the Mission Pinball Framework, built to be simple, lean and LLM-friendly
site_url: https://vukery.com/
repo_url: https://github.com/vukery/vukery
repo_name: vukery/vukery

theme:
  name: material
  features:
    - content.code.copy

nav:
  - Home: index.md
  - Status (0.0.x): status.md
  - Getting started: getting-started.md
  - Writing a game: writing-a-game.md
  - Modes: modes.md
  - Displays and slides: displays.md
  - Testing a game: testing.md
  - Examples: examples.md
  - The vuk command: cli.md
  - Logging: logging.md
  - Hardware:
      - FAST: hardware/fast.md
  - Devices:
      - Coils: devices/coils.md
      - Lights: devices/lights.md

extra_css:
  - stylesheets/mkdocs.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - attr_list
  - admonition
  - tables
