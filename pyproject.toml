[project]
name = "vukery"
version = "0.0.12"
description = "A very opinionated pinball framework based on the Mission Pinball Framework, built to be simple, lean and LLM-friendly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vukery/_mpf/NOTICE"]
requires-python = ">=3.15"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.urls]
Homepage = "https://vukery.com"
Repository = "https://github.com/vukery/vukery"

[project.optional-dependencies]
# The default media controller and the vuk me dashboard
mc = ["pyglet>=2.1.19"]  # also needs FFmpeg installed on the system

[dependency-groups]
# pyglet is in dev too, so the examples' media controller works after a plain `uv sync`
dev = ["pytest", "pytest-describe", "pytest-spec", "ruff", "pyright", "pyglet>=2.1.19"]
# Build the docs site locally: uv run mkdocs build --strict
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.2",
]

[project.scripts]
vuk = "vukery.cli:main"

[tool.uv]
# `uv sync` installs the dev tools and MkDocs, so `uv run pytest` and `uv run mkdocs build` just work
default-groups = ["dev", "docs"]
# Use uv's own Python builds, so every machine runs the same interpreter.
python-preference = "managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py315"
# MPF's files, kept verbatim as references (see vukery/_mpf/NOTICE)
extend-exclude = ["tests/mpf_ported"]

[tool.ruff.lint.per-file-ignores]
# Game modes declare `slides = {...}` on the class; asking game authors for ClassVar is noise
"examples/**" = ["RUF012"]

[tool.pyright]
include = ["vukery"]
typeCheckingMode = "strict"
pythonVersion = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
# RSpec-style specs: describe_*/it_* functions (pytest-describe), tree output (pytest-spec)
addopts = "--spec"
describe_prefixes = ["describe_", "context_"]
# Warnings (unclosed ports, event loops, sockets...) fail the run instead of scrolling past
filterwarnings = ["error"]
